<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Предметы со стрима</title>
  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-dark: #0a0c0e;
      --card-bg: #14171b;
      --card-border: #1f252d;
      --yellow-btn: #ffe600;
      --text-white: #ffffff;
      --text-gray: #7d8b99;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-white);
      padding: 14px;
      padding-bottom: 50px;
    }

    /* Шапка с кнопкой Назад */
    .top-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .back-btn {
      background: none;
      border: none;
      color: #fff;
      font-size: 22px;
      cursor: pointer;
      display: flex;
      align-items: center;
    }

    .top-bar h2 {
      font-size: 18px;
      font-weight: 700;
    }

    /* СЕТКА ТОВАРОВ В 2 КОЛОНКИ (как на 2 скрине) */
    .catalog-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    /* Сама карточка товара */
    .item-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    /* Обёртка картинки с золотой рамкой */
    .item-image-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 14px;
      overflow: hidden;
      background: radial-gradient(circle, #252b36 0%, #0d1015 100%);
      border: 1px solid rgba(255, 215, 0, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .item-image-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Плашка количества "308 шт" */
    .stock-badge {
      position: absolute;
      top: 6px;
      right: 6px;
      background: rgba(15, 20, 26, 0.75);
      backdrop-filter: blur(4px);
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-gray);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    /* Название товара */
    .item-title {
      font-size: 14px;
      font-weight: 700;
      text-align: center;
      margin: 10px 0;
      line-height: 1.2;
    }

    /* ЯРКО-ЖЕЛТАЯ КНОПКА (КАК НА СКРИНЕ) */
    .btn-price {
      background: var(--yellow-btn);
      color: #000;
      border: none;
      border-radius: 25px;
      padding: 9px 0;
      width: 100%;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: transform 0.1s, opacity 0.2s;
    }

    .btn-price:active {
      transform: scale(0.97);
      opacity: 0.9;
    }

    .coin-icon {
      width: 17px;
      height: 17px;
      border-radius: 50%;
      background: #000;
      color: var(--yellow-btn);
      font-size: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
    }

    /* МОДАЛЬНОЕ ОКНО ПРИ НАЖАТИИ */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 16px;
    }

    .modal-box {
      background: #161a20;
      border: 1px solid #28313d;
      border-radius: 20px;
      width: 100%;
      max-width: 360px;
      padding: 20px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .modal-header h3 {
      font-size: 16px;
      font-weight: 700;
    }

    .close-btn {
      background: none;
      border: none;
      color: #999;
      font-size: 26px;
      cursor: pointer;
      line-height: 1;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      color: var(--text-gray);
      margin-bottom: 6px;
    }

    /* Поле прикрепления фото */
    .upload-area {
      border: 1px dashed #3a4555;
      background: #0f1216;
      border-radius: 12px;
      padding: 12px;
      text-align: center;
      cursor: pointer;
      font-size: 13px;
      color: #a0aec0;
    }

    .upload-area input {
      display: none;
    }

    .img-preview {
      display: none;
      margin-top: 8px;
      text-align: center;
    }

    .img-preview img {
      max-height: 100px;
      border-radius: 8px;
    }

    /* Поле текста */
    .comment-input {
      width: 100%;
      background: #0f1216;
      border: 1px solid #28313d;
      border-radius: 10px;
      padding: 10px;
      color: #fff;
      font-size: 14px;
      outline: none;
      resize: vertical;
      min-height: 70px;
    }

    .comment-input:focus {
      border-color: var(--yellow-btn);
    }

    /* Кнопка отправки */
    .submit-order-btn {
      width: 100%;
      background: var(--yellow-btn);
      color: #000;
      border: none;
      border-radius: 14px;
      padding: 13px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 8px;
    }

    .submit-order-btn:disabled {
      opacity: 0.5;
    }
  </style>
</head>
<body>

  <!-- Верхняя панель -->
  <div class="top-bar">
    <button class="back-btn" onclick="history.back()">←</button>
    <h2>🎁 Предметы со стрима</h2>
  </div>

  <!-- ВИТРИНА ТОВАРОВ (2 КОЛОНКИ) -->
  <div class="catalog-grid">

    <!-- Товар 1: AirPods Pro 3 -->
    <div class="item-card">
      <div class="item-image-wrapper">
        <span class="stock-badge">308 шт</span>
        <img src="https://images.unsplash.com/photo-1600294037681-c80b4cb5b434?w=400" alt="AirPods">
      </div>
      <div class="item-title">AirPods Pro 3.</div>
      <button class="btn-price" onclick="openOrder('AirPods Pro 3.', '250 000')">
        <span class="coin-icon">©</span> 250 000
      </button>
    </div>

    <!-- Товар 2: Бонуска -->
    <div class="item-card">
      <div class="item-image-wrapper">
        <span class="stock-badge">295 шт</span>
        <img src="https://images.unsplash.com/photo-1549465220-1a8b9238cd48?w=400" alt="Бонуска">
      </div>
      <div class="item-title">Бонуска за 20.000₽</div>
      <button class="btn-price" onclick="openOrder('Бонуска за 20.000₽', '118 000')">
        <span class="coin-icon">©</span> 118 000
      </button>
    </div>

    <!-- Товар 3: 5000 рублей -->
    <div class="item-card">
      <div class="item-image-wrapper">
        <span class="stock-badge">292 шт</span>
        <img src="https://images.unsplash.com/photo-1621416894569-0f39ed31d247?w=400" alt="5000 рублей">
      </div>
      <div class="item-title">5000 рублей.</div>
      <button class="btn-price" onclick="openOrder('5000 рублей.', '70 000')">
        <span class="coin-icon">©</span> 70 000
      </button>
    </div>

    <!-- Товар 4: 2500 рублей -->
    <div class="item-card">
      <div class="item-image-wrapper">
        <span class="stock-badge">318 шт</span>
        <img src="https://images.unsplash.com/photo-1621416894569-0f39ed31d247?w=400" alt="2500 рублей">
      </div>
      <div class="item-title">2500 рублей.</div>
      <button class="btn-price" onclick="openOrder('2500 рублей.', '55 000')">
        <span class="coin-icon">©</span> 55 000
      </button>
    </div>

  </div>

  <!-- ВСПЛЫВАЮЩЕЕ МЕНЮ ЗАКАЗА -->
  <div class="modal-overlay" id="orderModal">
    <div class="modal-box">
      <div class="modal-header">
        <h3 id="modalTitle">Оформление покупки</h3>
        <button class="close-btn" onclick="closeOrder()">&times;</button>
      </div>

      <div class="form-group">
        <label>Выбранный товар:</label>
        <div id="modalPriceLabel" style="color: var(--yellow-btn); font-weight: 800; font-size: 15px;"></div>
      </div>

      <!-- Прикрепление фотки -->
      <div class="form-group">
        <label>Прикрепите скриншот / фотку:</label>
        <div class="upload-area" onclick="document.getElementById('photoInput').click()">
          <span id="uploadStatusText">📸 Нажмите, чтобы выбрать фото</span>
          <input type="file" id="photoInput" accept="image/*" onchange="previewImage(event)">
        </div>
        <div class="img-preview" id="imgPreviewBlock">
          <img id="previewImg" src="">
        </div>
      </div>

      <!-- Текстовое поле -->
      <div class="form-group">
        <label>Текст / комментарий / реквизиты:</label>
        <textarea id="orderText" class="comment-input" placeholder="Напишите никнейм на стриме, реквизиты или пожелание..."></textarea>
      </div>

      <button class="submit-order-btn" id="sendBtn" onclick="submitOrder()">Отправить администраторам</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    // ТВОИ ДАННЫЕ
    const BOT_TOKEN = "8627680335:AAEz39TjvH2QakSQfHtIcauDSJMqiofueYs";
    const ADMIN_IDS = [978548564, 1067693099]; // Твой ID и ID второго админа

    let currentItemTitle = "";
    let currentItemPrice = "";
    let uploadedFile = null;

    // Открыть окно заказа
    function openOrder(title, price) {
      currentItemTitle = title;
      currentItemPrice = price;
      document.getElementById('modalTitle').innerText = title;
      document.getElementById('modalPriceLabel').innerText = `Цена: ${price} баллов`;
      document.getElementById('orderModal').style.display = 'flex';
    }

    // Закрыть окно
    function closeOrder() {
      document.getElementById('orderModal').style.display = 'none';
      document.getElementById('photoInput').value = "";
      document.getElementById('orderText').value = "";
      document.getElementById('imgPreviewBlock').style.display = "none";
      document.getElementById('uploadStatusText').innerText = "📸 Нажмите, чтобы выбрать фото";
      uploadedFile = null;
    }

    // Предпросмотр выбранной фотки
    function previewImage(event) {
      const file = event.target.files[0];
      if (file) {
        uploadedFile = file;
        document.getElementById('uploadStatusText').innerText = "✅ Выбрано: " + file.name;
        const reader = new FileReader();
        reader.onload = function(e) {
          document.getElementById('previewImg').src = e.target.result;
          document.getElementById('imgPreviewBlock').style.display = "block";
        };
        reader.readAsDataURL(file);
      }
    }

    // ОТПРАВКА ЗАКАЗА АДМИНИСТРАТОРАМ
    async function submitOrder() {
      const text = document.getElementById('orderText').value.trim();
      const sendBtn = document.getElementById('sendBtn');

      if (!text && !uploadedFile) {
        alert("Пожалуйста, прикрепите фото или напишите текст!");
        return;
      }

      sendBtn.disabled = true;
      sendBtn.innerText = "⏳ Отправляем...";

      const user = tg?.initDataUnsafe?.user || {};
      const userName = user.first_name || "Игрок";
      const userNick = user.username ? `@${user.username}` : "без юзернейма";
      const userId = user.id || "Неизвестен";

      const messageCaption = 
        `🛍 <b>НОВЫЙ ЗАКАЗ ИЗ МАГАЗИНА!</b>\n\n` +
        `📦 <b>Товар:</b> ${currentItemTitle}\n` +
        `💰 <b>Стоимость:</b> ${currentItemPrice} баллов\n\n` +
        `👤 <b>Покупатель:</b> ${userName} (${userNick})\n` +
        `🆔 <b>ID:</b> <code>${userId}</code>\n\n` +
        `📝 <b>Комментарий:</b>\n${text || "Без текста"}`;

      try {
        for (const adminId of ADMIN_IDS) {
          if (uploadedFile) {
            // Если прикреплена фотка — шлём с фото
            const formData = new FormData();
            formData.append("chat_id", adminId);
            formData.append("photo", uploadedFile);
            formData.append("caption", messageCaption);
            formData.append("parse_mode", "HTML");

            await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
              method: "POST",
              body: formData
            });
          } else {
            // Если только текст
            await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                chat_id: adminId,
                text: messageCaption,
                parse_mode: "HTML"
              })
            });
          }
        }

        alert("🎉 Заказ успешно отправлен администраторам!");
        closeOrder();
      } catch (e) {
        alert("Ошибка отправки! Попробуйте еще раз.");
        console.error(e);
      } finally {
        sendBtn.disabled = false;
        sendBtn.innerText = "Отправить администраторам";
      }
    }
  </script>
</body>
</html>
