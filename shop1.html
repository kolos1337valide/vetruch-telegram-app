<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Магазин | Vetruch</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    :root {
      --bg: #050a07;
      --card: #0c1810;
      --border: #183020;
      --green: #00e676;
      --text: #fff;
      --muted: #799184;
      --gold: #ffca28;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 16px 14px 32px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    button, textarea { font: inherit; }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 760px;
      margin: 0 auto 18px;
    }

    .back, .balance {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px 14px;
      color: var(--text);
      background: #0d1e13;
      text-decoration: none;
      font-weight: 800;
    }

    .balance { color: var(--green); }

    h1 {
      max-width: 760px;
      margin: 0 auto 16px;
      font-size: 24px;
    }

    .shop-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      max-width: 760px;
      margin: auto;
    }

    .product-card {
      overflow: hidden;
      border: 1px solid #24372a;
      border-radius: 17px;
      background: #171918;
      cursor: pointer;
      transition: transform .15s, border-color .15s;
    }

    .product-card:active {
      transform: scale(.98);
      border-color: var(--green);
    }

    .product-card img {
      display: block;
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      background: #08120b;
    }

    .product-info { padding: 10px; }

    .product-name {
      min-height: 38px;
      font-size: 14px;
      font-weight: 900;
      line-height: 1.3;
    }

    .product-price {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 11px 6px;
      background: var(--green);
      color: #031207;
      font-weight: 900;
      text-align: center;
    }

    .note {
      max-width: 760px;
      margin: 16px auto 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    /* Окно покупки */
    .modal {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
      align-items: flex-end;
      justify-content: center;
      padding: 12px;
      background: rgba(0, 0, 0, .75);
    }

    .modal.open { display: flex; }

    .dialog {
      position: relative;
      width: 100%;
      max-width: 430px;
      max-height: 92vh;
      overflow-y: auto;
      padding: 16px;
      border: 1px solid #292929;
      border-radius: 18px;
      background: #191919;
    }

    .dialog-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      font-size: 18px;
      font-weight: 900;
    }

    .close {
      padding: 0 4px;
      border: 0;
      background: none;
      color: #888;
      font-size: 28px;
      cursor: pointer;
    }

    .modal-image {
      display: block;
      width: 100%;
      max-height: 290px;
      object-fit: contain;
      border-radius: 12px;
      background: #080808;
    }

    .modal-name {
      margin-top: 13px;
      font-size: 17px;
      font-weight: 900;
    }

    .modal-description {
      margin: 12px 0;
      color: #aaa;
      font-size: 14px;
      line-height: 1.45;
    }

    .order-text {
      width: 100%;
      min-height: 82px;
      resize: vertical;
      padding: 12px;
      border: 1px solid #383838;
      border-radius: 12px;
      outline: none;
      background: #090909;
      color: white;
    }

    .order-text:focus { border-color: var(--green); }

    .price-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
      padding: 13px;
      border: 1px solid #333;
      border-radius: 12px;
      background: #080808;
    }

    .error {
      min-height: 20px;
      margin: 8px 0;
      color: #ff4545;
      font-size: 13px;
    }

    .buy-button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 12px;
      background: var(--green);
      color: #031207;
      font-weight: 900;
      cursor: pointer;
    }

    .buy-button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    @media (min-width: 600px) {
      .shop-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .modal { align-items: center; }
    }
  </style>
</head>

<body>
  <header class="header">
    <a class="back" href="profile.html">‹ Меню</a>
    <div class="balance">💎 <span id="balance">0</span></div>
  </header>

  <h1>🛍️ Магазин</h1>
  <main class="shop-grid" id="shopGrid"></main>

  <p class="note">
    Перед публикацией подключи серверное API: клиентская демо-версия не подходит
    для реального списания алмазов и хранения заказов.
  </p>

  <div class="modal" id="purchaseModal">
    <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="dialog-header">
        <span>Покупка</span>
        <button class="close" id="closeModal" aria-label="Закрыть">×</button>
      </div>

      <img class="modal-image" id="modalImage" alt="">
      <div class="modal-name" id="modalTitle"></div>
      <div class="modal-description" id="modalDescription"></div>

      <textarea
        class="order-text"
        id="orderText"
        maxlength="500"
        placeholder="Напишите текст к заказу..."
      ></textarea>

      <div class="price-row">
        <span>Цена</span>
        <strong id="modalPrice"></strong>
      </div>

      <div class="error" id="errorMessage"></div>
      <button class="buy-button" id="buyButton">Купить</button>
    </section>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    tg?.ready();
    tg?.expand();

    const PRODUCTS = [
      {
        id: "iphone-duo",
        name: "iPhone Duo",
        price: 1500000,
        image: "iphone-duo.png",
        description: "После покупки с вами свяжется модератор для подтверждения заказа."
      },
      {
        id: "rubles-5000",
        name: "5 000 рублей",
        price: 65000,
        image: "rubles-5000.png",
        description: "Напишите в поле ниже ваш Telegram для связи."
      },
      {
        id: "rubles-1000",
        name: "1 000 рублей",
        price: 15000,
        image: "rubles-1000.png",
        description: "Напишите в поле ниже ваш Telegram для связи."
      },
      {
        id: "rubles-2500",
        name: "2 500 рублей",
        price: 45000,
        image: "rubles-2500.png",
        description: "Напишите в поле ниже ваш Telegram для связи."
      },
      {
        id: "bonus-10000",
        name: "Бонуска за 10 000 ₽",
        price: 100000,
        image: "bonus-10000.png",
        description: "Напишите название слота и ваш Telegram для связи."
      },
      {
        id: "slot-streamer",
        name: "Выбрать слот для стримера",
        price: 5000,
        image: "slot-streamer.png",
        description: "Напишите название слота, который хотите предложить стримеру."
      },
      {
        id: "vip-og",
        name: "VIP либо OG в чате",
        price: 45000,
        image: "vip-og.png",
        description: "Напишите ваш ник в чате и Telegram для связи."
      },
      {
        id: "iphone-18-pro-max",
        name: "iPhone 18 Pro Max",
        price: 1300000,
        image: "iphone-18-pro-max.png",
        description: "После покупки с вами свяжется модератор для подтверждения заказа."
      }
    ];

    const DEMO_MODE = true; // После настройки сервера заменить серверным API.
    const userId = String(tg?.initDataUnsafe?.user?.id || "demo");
    const balanceKey = "vetruch_balance_" + userId;

    let balance = Number(localStorage.getItem(balanceKey));
    if (!Number.isFinite(balance)) balance = 1000;

    let selectedProduct = null;

    function renderBalance() {
      document.getElementById("balance").textContent =
        balance.toLocaleString("ru-RU");
      localStorage.setItem(balanceKey, String(balance));
    }

    function renderProducts() {
      document.getElementById("shopGrid").innerHTML = PRODUCTS.map(product => `
        <article class="product-card" data-product-id="${product.id}">
          <img src="${product.image}" alt="${product.name}" loading="lazy">
          <div class="product-info">
            <div class="product-name">${product.name}</div>
            <div class="product-price">${product.price.toLocaleString("ru-RU")} 💎</div>
          </div>
        </article>
      `).join("");

      document.querySelectorAll(".product-card").forEach(card => {
        card.addEventListener("click", () => openProduct(card.dataset.productId));
      });
    }

    function openProduct(productId) {
      selectedProduct = PRODUCTS.find(product => product.id === productId);
      if (!selectedProduct) return;

      document.getElementById("modalImage").src = selectedProduct.image;
      document.getElementById("modalImage").alt = selectedProduct.name;
      document.getElementById("modalTitle").textContent = selectedProduct.name;
      document.getElementById("modalDescription").textContent =
        selectedProduct.description;
      document.getElementById("modalPrice").textContent =
        selectedProduct.price.toLocaleString("ru-RU") + " 💎";
      document.getElementById("orderText").value = "";
      document.getElementById("errorMessage").textContent = "";
      document.getElementById("purchaseModal").classList.add("open");
    }

    function closeModal() {
      document.getElementById("purchaseModal").classList.remove("open");
      selectedProduct = null;
    }

    function confirmDemoPurchase() {
      if (!selectedProduct) return;

      const orderText = document.getElementById("orderText").value.trim();
      const error = document.getElementById("errorMessage");

      if (!orderText) {
        error.textContent = "Сначала напишите текст к заказу.";
        return;
      }

      if (balance < selectedProduct.price) {
        error.textContent =
          "Недостаточно монет — не хватает " +
          (selectedProduct.price - balance).toLocaleString("ru-RU") + ".";
        tg?.HapticFeedback?.notificationOccurred("error");
        return;
      }

      // ДЕМО: это локальное списание, не использовать для настоящих покупок.
      balance -= selectedProduct.price;
      renderBalance();

      const orderKey = "vetruch_demo_orders_" + userId;
      let orders = [];
      try {
        orders = JSON.parse(localStorage.getItem(orderKey) || "[]");
      } catch (_) {}

      orders.unshift({
        productId: selectedProduct.id,
        productName: selectedProduct.name,
        price: selectedProduct.price,
        text: orderText,
        createdAt: new Date().toISOString()
      });

      localStorage.setItem(orderKey, JSON.stringify(orders.slice(0, 50)));

      tg?.HapticFeedback?.notificationOccurred("success");
      closeModal();
      alert("Покупка оформлена в демо-режиме. Серверное сохранение ещё не подключено.");
    }

    document.getElementById("buyButton").addEventListener("click", confirmDemoPurchase);
    document.getElementById("closeModal").addEventListener("click", closeModal);

    document.getElementById("purchaseModal").addEventListener("click", event => {
      if (event.target.id === "purchaseModal") closeModal();
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") closeModal();
    });

    renderProducts();
    renderBalance();
  </script>
</body>
</html>
