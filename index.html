<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моё мини-приложение</title>
    <!-- Подключаем скрипт Телеграма -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--tg-theme-bg-color, #181818);
            color: var(--tg-theme-text-color, #ffffff);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            width: 80%;
            max-width: 320px;
        }
        h2 { margin-top: 0; }
        .score { font-size: 48px; font-weight: bold; margin: 15px 0; color: #f5a623; }
        .btn {
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            font-weight: bold;
        }
        .btn:active { transform: scale(0.97); }
    </style>
</head>
<body>

    <div class="card">
        <h2>Привет, <span id="username">друг</span>! 👋</h2>
        <p>Кликай по монете:</p>
        <div class="score" id="counter">0</div>
        
        <button class="btn" onclick="addScore()">🪙 Тапнуть!</button>
        <button class="btn" style="background: #2ea043; margin-top: 15px;" onclick="sendDataToBot()">✅ Сохранить результат</button>
    </div>

    <script>
        // Инициализируем Telegram WebApp
        let tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем окно на весь экран

        // Получаем имя пользователя из Телеграма
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('username').innerText = tg.initDataUnsafe.user.first_name;
        }

        let count = 0;
        function addScore() {
            count++;
            document.getElementById('counter').innerText = count;
        }

        // Отправка данных обратно в чат с ботом
        function sendDataToBot() {
            let data = JSON.stringify({ score: count });
            tg.sendData(data); // Отправляет боту строку и закрывает приложение
        }
    </script>
</body>
</html>
