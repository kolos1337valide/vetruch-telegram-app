<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>История игр | Vetruch Emerald</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #050a07;
            --card-bg: #0c1810;
            --border: #183020;
            --accent: #00e676;
            --accent-glow: rgba(0, 230, 118, 0.35);
            --danger: #ff5252;
            --text-main: #ffffff;
            --text-muted: #5a7d66;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 16px;
            overflow-x: hidden;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .back-btn {
            background: #0f2216;
            border: 1px solid #1a4226;
            color: #69f0ae;
            padding: 8px 14px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.15s ease;
        }
        .back-btn:active { transform: scale(0.95); }

        .live-badge {
            background: #0d2616;
            border: 1px solid #1f4d2f;
            color: var(--accent);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 900;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 10px var(--accent);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.9); opacity: 0.6; }
            50% { transform: scale(1.3); opacity: 1; box-shadow: 0 0 14px var(--accent); }
            100% { transform: scale(0.9); opacity: 0.6; }
        }

        .history-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            max-width: 420px;
            margin: 0 auto;
        }

        .game-item {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: slideIn 0.35s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .game-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .game-icon-box {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            background: #07150c;
            border: 1px solid #1a3824;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            flex-shrink: 0;
        }

        .user-meta {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .user-nick {
            font-size: 14px;
            font-weight: 800;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .you-tag {
            background: var(--accent);
            color: #041409;
            font-size: 10px;
            font-weight: 900;
            padding: 1px 6px;
            border-radius: 6px;
        }

        .game-title-text {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .game-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 2px;
        }

        .game-payout {
            font-size: 15px;
            font-weight: 900;
        }
        .game-payout.win { color: var(--accent); text-shadow: 0 0 10px rgba(0, 230, 118, 0.3); }
        .game-payout.lose { color: var(--danger); }

        .game-time {
            font-size: 11px;
            color: #4e735a;
            font-weight: 600;
        }

        .empty-history-text {
            text-align: center;
            color: var(--text-muted);
            padding: 40px 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="header-bar">
        <a href="profile.html" class="back-btn">⬅️ Профиль</a>
        <div class="live-badge">
            <span class="pulse-dot"></span>
            <span>LIVE ИГРЫ</span>
        </div>
    </div>

    <div class="history-container" id="historyList"></div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            try { tg.expand(); } catch(e) {}
            if (tg.BackButton) {
                tg.BackButton.show();
                tg.BackButton.onClick(() => { window.location.href = 'profile.html'; });
            }
        }

        // ================= БАЗА ДАННЫХ ИГРОКА =================
        let rawUserId = tg?.initDataUnsafe?.user?.id;
        if (!rawUserId) {
            rawUserId = localStorage.getItem('vetruch_cached_uid') || 'player';
        }
        const userId = String(rawUserId);

        const STORAGE_GAMES_LOG_KEY = 'vetruch_game_history_' + userId;

        // Генератор реалистичных фейковых пользователей (массовка)
        const FAKE_USERS = [
            "Вася Пупкин", "Артём_777", "sanya_top", "Даня 💎", "Nikita_King",
            "Дмитрий С.", "Владлен", "Макс_Kick", "Alex_Vip", "Илья Б.",
            "kirill_dota", "Egor_God", "Андрюха_01", "romchik", "Тимур_Cash",
            "Mikhail_Winner", "stacy_glow", "Borya_Rich", "Влад_Мажор", "Олег_99"
        ];

        const GAMES_LIST = [
            { name: "Карты", icon: "🃏", multipliers: [1.2, 2.0, 5.0] },
            { name: "Кубики", icon: "🎲", multipliers: [1.02, 1.71, 2.05, 5.12, 10.23] },
            { name: "Шарик", icon: "🎈", multipliers: [1.15, 1.45, 2.10, 3.40, 4.80] }
        ];

        const BET_OPTIONS = [20, 50, 100, 200, 500, 1000];

        function getSavedHistory() {
            try {
                return JSON.parse(localStorage.getItem(STORAGE_GAMES_LOG_KEY)) || [];
            } catch(e) {
                return [];
            }
        }

        function saveHistory(list) {
            localStorage.setItem(STORAGE_GAMES_LOG_KEY, JSON.stringify(list.slice(0, 30)));
        }

        // Генерация одного случайного события (массовка)
        function generateFakeGameItem() {
            const user = FAKE_USERS[Math.floor(Math.random() * FAKE_USERS.length)];
            const game = GAMES_LIST[Math.floor(Math.random() * GAMES_LIST.length)];
            const bet = BET_OPTIONS[Math.floor(Math.random() * BET_OPTIONS.length)];
            
            // Шанс выигрыша ~48%
            const isWin = Math.random() < 0.48;
            let mult = 0;
            let payout = 0;

            if (isWin) {
                mult = game.multipliers[Math.floor(Math.random() * game.multipliers.length)];
                payout = Math.floor(bet * mult);
            }

            const now = new Date();
            const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            return {
                user: user,
                isRealPlayer: false,
                gameName: game.name,
                gameIcon: game.icon,
                bet: bet,
                isWin: isWin,
                payout: payout,
                mult: mult,
                time: timeStr
            };
        }

        function renderHistory() {
            const container = document.getElementById('historyList');
            let history = getSavedHistory();

            // Если список пустой — сразу создаём 8 реалистичных записей
            if (history.length === 0) {
                for (let i = 0; i < 8; i++) {
                    history.push(generateFakeGameItem());
                }
                saveHistory(history);
            }

            container.innerHTML = history.map(item => `
                <div class="game-item">
                    <div class="game-left">
                        <div class="game-icon-box">${item.gameIcon}</div>
                        <div class="user-meta">
                            <div class="user-nick">
                                <span>${item.user}</span>
                                ${item.isRealPlayer ? '<span class="you-tag">ВЫ</span>' : ''}
                            </div>
                            <div class="game-title-text">${item.gameName} • Ставка ${item.bet} 💎</div>
                        </div>
                    </div>
                    <div class="game-right">
                        <div class="game-payout ${item.isWin ? 'win' : 'lose'}">
                            ${item.isWin ? `+${item.payout} 💎 (x${item.mult})` : `-${item.bet} 💎`}
                        </div>
                        <div class="game-time">${item.time}</div>
                    </div>
                </div>
            `).join('');
        }
        renderHistory();

        // Добавление новой игры каждые 60–110 секунд (рандомное время для естественности)
        function scheduleNextFakeGame() {
            const delay = Math.floor(Math.random() * (110000 - 60000 + 1)) + 60000;
            setTimeout(() => {
                const newGame = generateFakeGameItem();
                let history = getSavedHistory();
                history.unshift(newGame);
                saveHistory(history);
                renderHistory();
                scheduleNextFakeGame();
            }, delay);
        }
        scheduleNextFakeGame();
    </script>
</body>
</html>
