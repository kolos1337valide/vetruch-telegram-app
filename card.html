<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Угадай Карту | Vetruch</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #050a07;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Верхняя панель */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background: #09160d;
            border-bottom: 1px solid #1a3824;
        }

        .back-btn {
            background: #102919;
            border: 1px solid #1a4d29;
            color: #e0f2e9;
            padding: 8px 14px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .back-btn:active { transform: scale(0.95); }

        .balance-chip {
            background: #0d1e13;
            border: 1px solid #00e676;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 15px;
            font-weight: 800;
            color: #00e676;
            box-shadow: 0 0 12px rgba(0, 230, 118, 0.25);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Арена */
        .game-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 16px;
            max-width: 420px;
            margin: 0 auto;
            width: 100%;
            overflow-y: auto;
        }

        .game-header {
            text-align: center;
            width: 100%;
        }

        .game-title {
            font-size: 20px;
            font-weight: 900;
            color: #e0f2e9;
        }

        /* Лестница коэффициентов */
        .ladder-steps {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-top: 10px;
        }
        .step-pill {
            padding: 5px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 800;
            background: #0f2216;
            border: 1px solid #1a4226;
            color: #5a7d66;
            transition: all 0.2s;
        }
        .step-pill.active {
            border-color: #00e676;
            color: #041409;
            background: #00e676;
            box-shadow: 0 0 12px rgba(0, 230, 118, 0.4);
        }

        /* Карточная сцена */
        .arena {
            width: 100%;
            height: 190px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .card-box {
            perspective: 800px;
            width: 105px;
            height: 150px;
        }

        .playing-card {
            width: 100%;
            height: 100%;
            border-radius: 14px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .playing-card.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Рубашка */
        .card-back {
            background: repeating-linear-gradient(45deg, #0e2b19, #0e2b19 8px, #144227 8px, #144227 16px);
            border: 2px solid #00e676;
            color: #00e676;
            font-size: 38px;
            box-shadow: inset 0 0 15px rgba(0, 230, 118, 0.3);
        }

        /* Лицевая сторона */
        .card-front {
            background: #ffffff;
            border: 2px solid #ffffff;
            transform: rotateY(180deg);
        }
        .card-front.red { color: #d32f2f; }
        .card-front.black { color: #111111; }

        .card-rank { font-size: 26px; font-weight: 900; line-height: 1; }
        .card-suit { font-size: 40px; line-height: 1; margin-top: 4px; }

        .status-text {
            font-size: 13px;
            font-weight: 800;
            text-align: center;
            color: #69f0ae;
            min-height: 20px;
            margin-top: 8px;
        }

        /* Панель управления */
        .controls-box {
            width: 100%;
            background: #0d1e13;
            border: 1px solid #1a3824;
            border-radius: 18px;
            padding: 14px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.7);
        }

        .bet-selector {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .bet-chips {
            display: flex;
            gap: 6px;
        }
        .chip {
            padding: 6px 10px;
            background: #102919;
            border: 1px solid #1a4d29;
            color: #69f0ae;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }
        .chip.active {
            background: #00e676;
            color: #041409;
            border-color: #00e676;
        }

        .action-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-top: 8px;
        }

        .btn-choice {
            padding: 12px;
            border-radius: 12px;
            border: 1px solid #1a4d29;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: #102919;
            color: #ffffff;
            transition: all 0.15s;
        }
        .btn-choice:active { transform: scale(0.96); }
        .btn-choice.red-btn { border-color: #ff5252; color: #ff5252; }
        .btn-choice.black-btn { border-color: #ffffff; color: #ffffff; }

        .cashout-btn {
            grid-column: span 2;
            padding: 14px;
            background: linear-gradient(180deg, #ffca28 0%, #f57f17 100%);
            border: none;
            border-radius: 12px;
            color: #2b1800;
            font-size: 15px;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 202, 40, 0.4);
        }
        .cashout-btn:active { transform: scale(0.97); }

        .ranks-scroll {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            max-height: 120px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

    <!-- ВЕРХНЯЯ ПАНЕЛЬ -->
    <div class="top-bar">
        <a href="profile.html" class="back-btn">⬅️ Меню</a>
        <div class="balance-chip">
            <span>💎</span>
            <span id="balance-val">0</span>
        </div>
    </div>

    <!-- ИГРОВОЙ ЭКРАН -->
    <div class="game-container">
        
        <div class="game-header">
            <h1 class="game-title">🃏 Угадай Карту</h1>
            <div class="ladder-steps">
                <div class="step-pill" id="pill-step1">1. Цвет (x1.2)</div>
                <div class="step-pill" id="pill-step2">2. Масть (x2.0)</div>
                <div class="step-pill" id="pill-step3">3. Карта (x5.0)</div>
            </div>
        </div>

        <!-- АРЕНА КАРТЫ -->
        <div class="arena">
            <div class="card-box">
                <div class="playing-card" id="cardElement">
                    <div class="card-face card-back">🍀</div>
                    <div class="card-face card-front" id="cardFront">
                        <div class="card-rank" id="cardRank">A</div>
                        <div class="card-suit" id="cardSuit">♠</div>
                    </div>
                </div>
            </div>
            <div class="status-text" id="status-text">Выберите цвет карты</div>
        </div>

        <!-- УПРАВЛЕНИЕ -->
        <div class="controls-box">
            
            <div class="bet-selector" id="bet-row">
                <span style="font-size: 12px; color: #5a7d66;">Ставка: <b id="current-bet-display" style="color: #00e676;">50</b> 💎</span>
                <div class="bet-chips">
                    <div class="chip" onclick="setBet(20, this)">20</div>
                    <div class="chip active" onclick="setBet(50, this)">50</div>
                    <div class="chip" onclick="setBet(100, this)">100</div>
                    <div class="chip" onclick="setBet(200, this)">200</div>
                </div>
            </div>

            <!-- ДИНАМИЧЕСКИЕ КНОПКИ ВЫБОРА -->
            <div id="controls-container"></div>
        </div>

    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.expand();
            if (tg.BackButton) {
                tg.BackButton.show();
                tg.BackButton.onClick(() => { window.location.href = 'profile.html'; });
            }
        }

        // ================= СИНХРОНИЗАЦИЯ БАЛАНСА И ТРАНЗАКЦИЙ =================
        const userId = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) ? tg.initDataUnsafe.user.id : 'player';
        const STORAGE_BALANCE_KEY = 'vetruch_balance_' + userId;
        const STORAGE_TX_KEY = 'vetruch_tx_history_' + userId;

        let score = parseInt(localStorage.getItem(STORAGE_BALANCE_KEY), 10);
        if (isNaN(score)) {
            score = 0;
            localStorage.setItem(STORAGE_BALANCE_KEY, score);
        }

        function updateBalanceUI() {
            document.getElementById('balance-val').innerText = score.toLocaleString('ru-RU');
            localStorage.setItem(STORAGE_BALANCE_KEY, score);
        }
        updateBalanceUI();

        function addTransaction(title, amount, type) {
            let txs = [];
            try { txs = JSON.parse(localStorage.getItem(STORAGE_TX_KEY)) || []; } catch(e) {}
            const now = new Date();
            const dateStr = now.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric' });

            txs.unshift({
                title: title,
                amount: (type === 'plus' ? '+' : '-') + Math.abs(amount),
                type: type,
                date: dateStr
            });
            if (txs.length > 30) txs.pop();
            localStorage.setItem(STORAGE_TX_KEY, JSON.stringify(txs));
        }

            { name: 'spades', symbol: '♠', color: 'black' }
        ];
        const RANKS = ['6', '7', '8', '9', '10', 'J', 'Q', 'K', 'A'];

        let currentBet = 50;
        let gameActive = false;
        let secretCard = null;
        let currentStep = 1; // 1 = цвет, 2 = масть, 3 = карта
        let currentMultiplier = 1.0;

        function setBet(amount, el) {
            if (gameActive) return;
            currentBet = amount;
            document.getElementById('current-bet-display').innerText = amount;
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            if (tg?.HapticFeedback) tg.HapticFeedback.selectionChanged();
        }

        function updateStepPills() {
            document.getElementById('pill-step1').className = 'step-pill' + (currentStep === 1 ? ' active' : '');
            document.getElementById('pill-step2').className = 'step-pill' + (currentStep === 2 ? ' active' : '');
            document.getElementById('pill-step3').className = 'step-pill' + (currentStep === 3 ? ' active' : '');
        }

        function renderControls() {
            const container = document.getElementById('controls-container');
            const betRow = document.getElementById('bet-row');

            if (!gameActive) {
                betRow.style.display = 'flex';
                updateStepPills();
                container.innerHTML = `
                    <div style="font-size: 12px; color: #5a7d66; margin-bottom: 6px;">Шаг 1: Угадай цвет рубашки (x1.2)</div>
                    <div class="action-grid">
                        <button class="btn-choice red-btn" onclick="makeGuess('color', 'red')">🔴 Красный</button>
                        <button class="btn-choice black-btn" onclick="makeGuess('color', 'black')">⚫ Чёрный</button>
                    </div>
                `;
            } else if (currentStep === 2) {
                betRow.style.display = 'none';
                updateStepPills();
                const takeAmount = Math.floor(currentBet * currentMultiplier);
                container.innerHTML = `
                    <div class="action-grid">
                        <button class="cashout-btn" onclick="takeCashout()">💰 ЗАБРАТЬ ${takeAmount} 💎 (x1.2)</button>
                        <button class="btn-choice red-btn" onclick="makeGuess('suit', 'hearts')">♥ Черви (x2)</button>
                        <button class="btn-choice red-btn" onclick="makeGuess('suit', 'diamonds')">♦ Буби (x2)</button>
                        <button class="btn-choice black-btn" onclick="makeGuess('suit', 'clubs')">♣ Крести (x2)</button>
                        <button class="btn-choice black-btn" onclick="makeGuess('suit', 'spades')">♠ Пики (x2)</button>

                `;
